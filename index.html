<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Official Form Validation System</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
}

body{
background:linear-gradient(135deg,#4facfe,#00f2fe);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
background:white;
width:380px;
padding:30px;
border-radius:12px;
box-shadow:0 15px 30px rgba(0,0,0,0.2);
}

h2{
text-align:center;
margin-bottom:20px;
color:#333;
}

.input-group{
margin-bottom:15px;
}

label{
font-weight:600;
font-size:14px;
}

input{
width:100%;
padding:10px;
margin-top:5px;
border-radius:6px;
border:1px solid #ccc;
font-size:14px;
}

input:focus{
border-color:#4facfe;
outline:none;
}

input.valid{
border:2px solid #28a745;
}

input.invalid{
border:2px solid #dc3545;
}

.error{
color:#dc3545;
font-size:12px;
margin-top:3px;
}

.strength{
font-size:12px;
margin-top:3px;
font-weight:bold;
}

button{
width:100%;
padding:10px;
background:#4facfe;
border:none;
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#2e8df7;
}

.success{
text-align:center;
margin-top:10px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h2>Form Validation</h2>

<form id="form" novalidate>

<div class="input-group">
<label>Name</label>
<input type="text" id="name">
<div class="error" id="nameError"></div>
</div>

<div class="input-group">
<label>Email</label>
<input type="text" id="email">
<div class="error" id="emailError"></div>
</div>

<div class="input-group">
<label>Age</label>
<input type="number" id="age">
<div class="error" id="ageError"></div>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password">
<div class="strength" id="strengthMsg"></div>
<div class="error" id="passwordError"></div>
</div>

<button type="submit">Submit</button>

<div class="success" id="formStatus"></div>

</form>

</div>

<script>

const nameField=document.getElementById("name");
const emailField=document.getElementById("email");
const ageField=document.getElementById("age");
const passwordField=document.getElementById("password");
const form=document.getElementById("form");

function setError(field,msg,id){
field.classList.add("invalid");
field.classList.remove("valid");
document.getElementById(id).innerText=msg;
}

function setSuccess(field,id){
field.classList.remove("invalid");
field.classList.add("valid");
document.getElementById(id).innerText="";
}

/* NAME VALIDATION (ONLY LETTERS ALLOWED) */

nameField.addEventListener("keypress",function(e){

let char=String.fromCharCode(e.keyCode);

if(!/[A-Za-z ]/.test(char)){
e.preventDefault();
document.getElementById("nameError").innerText="Only characters allowed";
}

});

/* EMAIL VALIDATION */

function validateEmail(){

let pattern=/^[a-zA-Z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/;

if(!pattern.test(emailField.value)){
setError(emailField,"Enter valid email (example@gmail.com)","emailError");
return false;
}

setSuccess(emailField,"emailError");
return true;

}

/* AGE VALIDATION */

function validateAge(){

let age=ageField.value;

if(age<18 || age>60){
setError(ageField,"Age must be between 18 and 60","ageError");
return false;
}

setSuccess(ageField,"ageError");
return true;

}

/* PASSWORD STRENGTH */

passwordField.addEventListener("input",function(){

let pass=passwordField.value;
let msg=document.getElementById("strengthMsg");

let strength=0;

if(pass.length>=6) strength++;
if(/[A-Z]/.test(pass)) strength++;
if(/[0-9]/.test(pass)) strength++;
if(/[!@#$%^&*]/.test(pass)) strength++;

if(pass.length==0){
msg.innerText="";
return;
}

if(strength<=1){
msg.innerText="Weak Password";
msg.style.color="red";
}

else if(strength==2 || strength==3){
msg.innerText="Medium Password";
msg.style.color="orange";
}

else{
msg.innerText="Strong Password";
msg.style.color="green";
}

});

/* PASSWORD VALIDATION */

function validatePassword(){

if(passwordField.value.length<6){
setError(passwordField,"Password must be at least 6 characters","passwordError");
return false;
}

setSuccess(passwordField,"passwordError");
return true;

}

/* FORM SUBMIT */

form.addEventListener("submit",function(e){

e.preventDefault();

let validEmail=validateEmail();
let validAge=validateAge();
let validPassword=validatePassword();

let status=document.getElementById("formStatus");

if(validEmail && validAge && validPassword){
status.innerText="✅ Form Submitted Successfully";
status.style.color="green";
}

else{
status.innerText="❌ Form contains errors";
status.style.color="red";
}

});

</script>
<script type="text/javascript">
    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/and/g, "&");
          })
          .join("?");
        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    })(window.location);
  </script>

</body>
</html>
